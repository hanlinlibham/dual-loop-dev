name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure Git identity for temporary test fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Dual-Loop CI"

      - name: Run full unit and counterexample test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run end-to-end minimal project demo
        run: python3 examples/minimal-project/run_demo.py

      - name: Install package and verify unified CLI entry point
        run: |
          python3 -m pip install -e .
          dual-loop --version
          dual-loop --help
          dual-loop controller --help
          dual-loop roadmap --help
